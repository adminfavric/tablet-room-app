name: tabletroom_viewer
description: Panel de agenda de sala de reuniones (solo lectura) para tablet Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0 # sala configurada en el dispositivo
  wakelock_plus: ^1.2.0 # mantener pantalla encendida

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/inarco_icon.png
